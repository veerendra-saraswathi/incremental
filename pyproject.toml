[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "incremental-hils"
version = "0.1.0"
description = "Incremental Learning Based Anomaly Detection for Hardware-in-the-Loop Simulation (HILS)"
authors = [
    {name = "Veerendra", email = "veerendra.saraswathi@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "polars>=1.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "river>=0.21.0",
    "torch>=2.2",
    "pyyaml>=6.0",
    "rich>=13.7",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "streamlit>=1.32",
    "pydantic>=2.5",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "black>=24.0",
    "ruff>=0.3",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.ruff]
line-length = 100
